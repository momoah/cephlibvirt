---
- name: Setup nginx SSL proxy for RGW
  hosts: cephadmin
  become: true
  tasks:
    - name: Install nginx for SSL proxy
      ansible.builtin.dnf:
        name: nginx
        state: present

    - name: Configure nginx as RGW SSL proxy
      ansible.builtin.copy:
        content: |
          server {
              listen 9443 ssl;
              http2 on;
              server_name cephadmin.local.labmesh.org;

              ssl_certificate /etc/ceph/ssl/rgw.crt;
              ssl_certificate_key /etc/ceph/ssl/rgw.key;

              location / {
                  proxy_pass http://127.0.0.1:80;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
              }
          }
        dest: /etc/nginx/conf.d/rgw.conf
        mode: '0644'

    - name: Replace nginx main config
      ansible.builtin.copy:
        content: |
          user nginx;
          worker_processes auto;
          error_log /var/log/nginx/error.log;
          pid /run/nginx.pid;

          events {
              worker_connections 1024;
          }

          http {
              log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                              '$status $body_bytes_sent "$http_referer" '
                              '"$http_user_agent" "$http_x_forwarded_for"';
              access_log /var/log/nginx/access.log main;
              sendfile on;
              tcp_nopush on;
              tcp_nodelay on;
              keepalive_timeout 65;
              types_hash_max_size 2048;
              include /etc/nginx/mime.types;
              default_type application/octet-stream;
              include /etc/nginx/conf.d/*.conf;
          }
        dest: /etc/nginx/nginx.conf
        mode: '0644'

    - name: Enable and start nginx
      ansible.builtin.systemd:
        name: nginx
        enabled: yes
        state: started

    - name: Verify HTTPS endpoint
      ansible.builtin.shell: |
        curl -k -s https://cephadmin.local.labmesh.org:9443/ | head -1
      register: rgw_https_test

    - name: Print HTTPS summary
      ansible.builtin.debug:
        msg: |
          RGW Setup Complete with SSL
          HTTP: http://cephadmin.local.labmesh.org:80/
          HTTPS: https://cephadmin.local.labmesh.org:9443/
          Proxy: nginx
          Certificate: Let's Encrypt (*.local.labmesh.org)
