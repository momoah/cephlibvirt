---
- name: Ceph Admin Post-Bootstrap Configuration
  hosts: cephadmin
  become: true
  gather_facts: yes
  
  tasks:
    - name: Print output of inventory
      ansible.builtin.debug:
        msg: "hostname {{ host_name }}, ip address: {{ ip_address }}"
      vars:
        ip_address: "{{ hostvars[item]['ansible_host'] }}"
        host_name: "{{ hostvars[item]['inventory_hostname'] }}"
      with_items: "{{ groups['myvms'] }}"

    - name: Copy ssh keys to hosts with ssh-copy-id
      ansible.builtin.shell: |
        ssh-copy-id -f -i /etc/ceph/ceph.pub -o StrictHostKeyChecking=no {{ cephusername }}@{{ item }}.{{ domain }}
      args:
        chdir: /usr/share/cephadm-ansible/
      with_items: "{{ groups['myvms'] }}"

    - name: List hosts in current ceph cluster
      ansible.builtin.shell: |
        ceph orch host ls
      args:
        chdir: /usr/share/cephadm-ansible/
      register: ceph_orch_host_ls_before

    - name: Print output of host listing
      ansible.builtin.debug:
        var: ceph_orch_host_ls_before

    - name: Add ceph nodes to cluster and assign roles
      ansible.builtin.shell: |
        echo "Working on: {{ host_name }}"
        ceph orch host add {{ host_name }} {{ ip_address }}
        {% if 'ceph-' in host_name %}
        echo "Assigning roles to ceph node {{ host_name }}"
          {% if 'osd' in ceph_roles %}
          echo "Assigning osd role to {{ host_name }}"
          ceph orch host label add {{ host_name }} osd
          {% endif %}
          {% if 'mon' in ceph_roles %}
          echo "Assigning mon role to {{ host_name }}"
          ceph orch host label add {{ host_name }} mon
          {% endif %}
          {% if 'mgr' in ceph_roles %}
          echo "Assigning mgr role to {{ host_name }}"
          ceph orch host label add {{ host_name }} mgr
          {% endif %}
          {% if 'mds' in ceph_roles %}
          echo "Assigning mds role to {{ host_name }}"
          ceph orch host label add {{ host_name }} mds
          {% endif %}
          {% if 'rgw' in ceph_roles %}
          echo "Assigning rgw role to {{ host_name }}"
          ceph orch host label add {{ host_name }} rgw
          {% endif %}
        {% endif %}
      args:
        chdir: /usr/share/cephadm-ansible/
      vars:
        ip_address: "{{ hostvars[item]['ansible_host'] }}"
        host_name: "{{ hostvars[item]['inventory_hostname'] }}"
        ceph_roles: "{{ hostvars[item]['ceph_roles'] }}"
      with_items: "{{ groups['myvms'] }}"
      register: assign_roles

    - name: Print output of adding and assigning roles
      ansible.builtin.debug:
        var: assign_roles

    - name: List hosts and apply roles
      ansible.builtin.shell: |
        ceph orch apply mon --placement="*"
        ceph orch apply mgr --placement="*"
        ceph orch apply osd --all-available-devices
        ceph orch host ls
      args:
        chdir: /usr/share/cephadm-ansible/
      register: ceph_orch_host_ls_after

    - name: Print output of host listing and role application
      ansible.builtin.debug:
        var: ceph_orch_host_ls_after

    - name: Copy the ceph-external-cluster-details-exporter.py to /root
      ansible.builtin.copy:
        src: ../files/ceph-external-cluster-details-exporter.py
        dest: /root/
        mode: '755'

    - name: Copy certs for dashboard
      ansible.builtin.copy:
        content: "{{ item.content }}"
        dest: "{{ item.dest }}"
        mode: '0600'
      loop:
        - { content: "{{ letsencrypt_cert }}", dest: /etc/ceph/dashboard.crt }
        - { content: "{{ letsencrypt_key_path }}", dest: /etc/ceph/dashboard.key }
      no_log: true

    - name: Set dashboard SSL certificate
      ansible.builtin.shell: |
        ceph dashboard set-ssl-certificate -i /etc/ceph/dashboard.crt
        ceph dashboard set-ssl-certificate-key -i /etc/ceph/dashboard.key
        ceph mgr fail
      args:
        chdir: /usr/share/cephadm-ansible/

    - name: Create RGW realm
      ansible.builtin.shell: |
        cephadm shell -- radosgw-admin realm get --rgw-realm={{ rgw_realm }} 2>/dev/null || \
        cephadm shell -- radosgw-admin realm create --rgw-realm={{ rgw_realm }} --default
      args:
        chdir: /usr/share/cephadm-ansible/
      ignore_errors: true

    - name: Create or update RGW zonegroup
      ansible.builtin.shell: |
        cephadm shell -- radosgw-admin zonegroup create --rgw-realm={{ rgw_realm }} --rgw-zonegroup={{ rgw_zonegroup }} --master --default 2>/dev/null || \
        cephadm shell -- radosgw-admin zonegroup modify --rgw-realm={{ rgw_realm }} --rgw-zonegroup={{ rgw_zonegroup }} --master --default
      args:
        chdir: /usr/share/cephadm-ansible/
      ignore_errors: true

    - name: Create or update RGW zone
      ansible.builtin.shell: |
        cephadm shell -- radosgw-admin zone create --rgw-realm={{ rgw_realm }} --rgw-zonegroup={{ rgw_zonegroup }} --rgw-zone={{ rgw_zone }} --master --default 2>/dev/null || \
        cephadm shell -- radosgw-admin zone modify --rgw-realm={{ rgw_realm }} --rgw-zonegroup={{ rgw_zonegroup }} --rgw-zone={{ rgw_zone }} --master --default
      args:
        chdir: /usr/share/cephadm-ansible/
      ignore_errors: true      

    - name: Commit RGW period
      ansible.builtin.shell: |
        cephadm shell -- radosgw-admin period update --commit
      args:
        chdir: /usr/share/cephadm-ansible/
      register: period_commit

    - name: Print period commit result
      ansible.builtin.debug:
        var: period_commit.stdout_lines

    - name: Create RGW spec file with embedded SSL certificate
      ansible.builtin.copy:
        content: |
          service_type: rgw
          service_id: rados
          placement:
            hosts:
              - cephadmin
          spec:
            ssl: true
            rgw_frontend_port: {{ rgw_port }}
            rgw_realm: {{ rgw_realm }}
            rgw_zonegroup: {{ rgw_zonegroup }}
            rgw_zone: {{ rgw_zone }}
            rgw_frontend_ssl_certificate: |
              {{ letsencrypt_key_path | indent(4) }}
              {{ letsencrypt_cert | indent(4) }}
        dest: /tmp/rgw-spec.yaml
        mode: '0644'

    - name: Apply RGW spec with SSL
      ansible.builtin.shell: |
        ceph orch apply -i /tmp/rgw-spec.yaml
      args:
        chdir: /usr/share/cephadm-ansible/
      register: rgw_spec_apply

    - name: Redeploy RGW to pick up spec changes
      ansible.builtin.shell: ceph orch redeploy rgw.rados
      args:
        chdir: /usr/share/cephadm-ansible/

    - name: Wait for RGW daemon to start
      ansible.builtin.pause:
        seconds: 30

    - name: Create openshift S3 user
      ansible.builtin.shell: |
        cephadm shell -- radosgw-admin user info --uid=openshift >/dev/null 2>&1 || \
        cephadm shell -- radosgw-admin user create --uid=openshift --display-name="OpenShift S3"
      args:
        chdir: /usr/share/cephadm-ansible/
      register: rgw_user

    - name: Verify RGW listening on SSL port
      ansible.builtin.shell: |
        ss -tlnp | grep ':{{ rgw_port }}' | grep radosgw || (echo "radosgw not on {{ rgw_port }}"; exit 1)
      register: rgw_port_verify
      retries: 5
      delay: 10
      until: rgw_port_verify.rc == 0

    - name: Create OpenShift RBD pool
      ansible.builtin.shell: |
        ceph osd pool create openshift 128 128 replicated
        ceph osd pool set openshift size 1
        ceph osd pool application enable openshift rbd
      args:
        chdir: /usr/share/cephadm-ansible/
      register: pool_creation
      ignore_errors: true

    - name: Print RGW setup summary
      ansible.builtin.debug:
        msg: |
          RGW Setup Complete
          Service: rgw.rados
          HTTPS: https://{{ rgw_host }}:{{ rgw_port }}/
          Certificate: Let's Encrypt ({{ domain }})
          OpenShift User: openshift
          RBD Pool: openshift (1 replica)
