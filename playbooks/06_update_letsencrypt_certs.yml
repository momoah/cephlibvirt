---
- name: Update Ceph RGW SSL Certificates
  hosts: cephadmin
  become: true
  vars:
    ceph_cert_path: "/etc/ceph/ssl"
  tasks:

    - name: Copy Let's Encrypt certificate
      ansible.builtin.copy:
        content: "{{ letsencrypt_cert }}"
        dest: "{{ ceph_cert_path }}/rgw.crt"
        mode: '0600'
      no_log: true
    
    - name: Copy Let's Encrypt private key
      ansible.builtin.copy:
        content: "{{ letsencrypt_key_path }}"
        dest: "{{ ceph_cert_path }}/rgw.key"
        mode: '0600'
      no_log: true
    
    - name: Set proper ownership on certificates
      ansible.builtin.file:
        path: "{{ item }}"
        mode: '0600'
        owner: root
        group: root
      loop:
        - "{{ ceph_cert_path }}/rgw.crt"
        - "{{ ceph_cert_path }}/rgw.key"

    - name: Update Ceph config-key with new certificates
      ansible.builtin.shell: |
        ceph config-key set rgw/cert/{{ rgw_realm }}/{{ rgw_zone }}.crt -i {{ ceph_cert_path }}/rgw.crt
        ceph config-key set rgw/cert/{{ rgw_realm }}/{{ rgw_zone }}.key -i {{ ceph_cert_path }}/rgw.key
      args:
        chdir: /usr/share/cephadm-ansible/

    - name: Restart RGW to apply new certificates
      ansible.builtin.shell: |
        ceph orch restart rgw.rados
      args:
        chdir: /usr/share/cephadm-ansible/
      register: rgw_restart

    - name: Wait for RGW to be ready
      ansible.builtin.shell: |
        ceph orch ps --daemon_type rgw --format json | grep -q '"status": "running"'
      args:
        chdir: /usr/share/cephadm-ansible/
      register: rgw_status
      until: rgw_status.rc == 0
      retries: 10
      delay: 5

    - name: Display renewal status
      ansible.builtin.debug:
        msg: |
          Let's Encrypt certificates updated successfully!
          - Realm: {{ rgw_realm }}
          - Zone: {{ rgw_zone }}
          - RGW restarted: {{ rgw_restart.rc == 0 }}
          - Certificate expiry: {{ ansible_date_time.iso8601 }}
